<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sg2" x1="0.1" y1="1" x2="0.9" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#08175c"/>
      <stop offset="100%" stop-color="#1a6fd8"/>
    </linearGradient>
    <linearGradient id="ag2" x1="0" y1="1" x2="0.75" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0d1f6e"/>
      <stop offset="55%"  stop-color="#1060a8"/>
      <stop offset="100%" stop-color="#5ecb20"/>
    </linearGradient>
    <linearGradient id="gg2" x1="0" y1="1" x2="0.8" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#237d0e"/>
      <stop offset="100%" stop-color="#7ad92e"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" fill="white" rx="16"/>

  <!-- D arc -->
  <path d="M 58,10 A 38,38 0 1,1 58,90"
        fill="none" stroke="url(#ag2)" stroke-width="14" stroke-linecap="round"/>

  <!-- S letter (shadow) -->
  <text x="4" y="76"
        font-family="'Arial Black', Impact, sans-serif"
        font-size="72" font-weight="900" font-style="italic"
        fill="#06104a" transform="translate(2,2)">S</text>
  <!-- S letter -->
  <text x="4" y="76"
        font-family="'Arial Black', Impact, sans-serif"
        font-size="72" font-weight="900" font-style="italic"
        fill="url(#sg2)">S</text>

  <!-- Bar chart -->
  <rect x="62" y="58" width="6" height="24" rx="1.5" fill="url(#gg2)"/>
  <rect x="72" y="46" width="6" height="36" rx="1.5" fill="url(#gg2)"/>
  <rect x="83" y="34" width="5" height="48" rx="1.5" fill="url(#gg2)"/>

  <!-- Arrow -->
  <line x1="64" y1="58" x2="92" y2="18"
        stroke="url(#gg2)" stroke-width="5.5" stroke-linecap="round"/>
  <polygon points="92,18  76,26  82,38" fill="#68d425"/>

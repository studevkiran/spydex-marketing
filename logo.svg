<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <defs>
    <!-- Blue gradient for S -->
    <linearGradient id="sGrad" x1="0.1" y1="1" x2="0.9" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#08175c"/>
      <stop offset="50%"  stop-color="#0c3498"/>
      <stop offset="100%" stop-color="#1a6fd8"/>
    </linearGradient>
    <!-- Blue-to-green gradient for D arc -->
    <linearGradient id="arcGrad" x1="0" y1="1" x2="0.75" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0d1f6e"/>
      <stop offset="45%"  stop-color="#1060a8"/>
      <stop offset="80%"  stop-color="#1a9e55"/>
      <stop offset="100%" stop-color="#5ecb20"/>
    </linearGradient>
    <!-- Green gradient for bars + arrow -->
    <linearGradient id="gGrad" x1="0" y1="1" x2="0.8" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#237d0e"/>
      <stop offset="100%" stop-color="#7ad92e"/>
    </linearGradient>
    <!-- Shadow/depth for S -->
    <linearGradient id="sShadow" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#061045"/>
      <stop offset="100%" stop-color="#0a1f6e"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="220" height="200" fill="white"/>

  <!-- ── D ARC (thick open arc, opens to the left) ── -->
  <!-- Centre ≈ (130, 100), radius ≈ 78 -->
  <path d="M 125,16 A 82,82 0 1,1 125,184"
        fill="none"
        stroke="url(#arcGrad)"
        stroke-width="26"
        stroke-linecap="round"/>

  <!-- ── S LETTER (bold italic) ── -->
  <!-- Shadow/depth layer -->
  <text x="10" y="152"
        font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif"
        font-size="148" font-weight="900" font-style="italic"
        fill="url(#sShadow)"
        transform="translate(3,4)">S</text>
  <!-- Main S -->
  <text x="10" y="152"
        font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif"
        font-size="148" font-weight="900" font-style="italic"
        fill="url(#sGrad)">S</text>

  <!-- ── RISING BAR CHART (inside D arc) ── -->
  <rect x="130" y="120" width="12" height="44" rx="2.5" fill="url(#gGrad)"/>
  <rect x="147" y="100" width="12" height="64" rx="2.5" fill="url(#gGrad)"/>
  <rect x="164" y="80"  width="11" height="84" rx="2.5" fill="url(#gGrad)"/>
  <rect x="180" y="62"  width="10" height="102" rx="2.5" fill="url(#gGrad)"/>

  <!-- ── GROWTH ARROW ── -->
  <!-- Diagonal shaft -->
  <line x1="132" y1="120" x2="196" y2="30"
        stroke="url(#gGrad)" stroke-width="11"
        stroke-linecap="round"/>
  <!-- Arrowhead (filled triangle pointing up-right) -->
  <polygon points="196,30  172,42  183,58" fill="#68d425"/>
  <!-- Arrowhead highlight -->
  <polygon points="196,30  176,36  185,46" fill="#85e840"/>
</svg>
